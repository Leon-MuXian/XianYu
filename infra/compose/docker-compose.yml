name: seren-meet

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SEREN_MEET_DB_NAME:-seren_meet}
      POSTGRES_USER: ${SEREN_MEET_DB_USER:-seren_meet}
      POSTGRES_PASSWORD: ${SEREN_MEET_DB_PASSWORD:?SEREN_MEET_DB_PASSWORD is required}
    volumes:
      - seren_meet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ../../apps/api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-trial}
      SEREN_MEET_DB_URL: jdbc:postgresql://postgres:5432/${SEREN_MEET_DB_NAME:-seren_meet}
      SEREN_MEET_DB_USER: ${SEREN_MEET_DB_USER:-seren_meet}
      SEREN_MEET_DB_PASSWORD: ${SEREN_MEET_DB_PASSWORD:?SEREN_MEET_DB_PASSWORD is required}
      SEREN_MEET_ADMIN_ORIGIN: ${SEREN_MEET_ADMIN_ORIGIN:-http://127.0.0.1:8088}
      SEREN_MEET_BOOTSTRAP_ADMIN_USERNAME: ${SEREN_MEET_BOOTSTRAP_ADMIN_USERNAME:-}
      SEREN_MEET_BOOTSTRAP_ADMIN_PASSWORD: ${SEREN_MEET_BOOTSTRAP_ADMIN_PASSWORD:-}
      SEREN_MEET_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${SEREN_MEET_BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
      SEREN_MEET_STAFF_CREDENTIAL_ACTIVE_KEY_ID: ${SEREN_MEET_STAFF_CREDENTIAL_ACTIVE_KEY_ID:?SEREN_MEET_STAFF_CREDENTIAL_ACTIVE_KEY_ID is required}
      SEREN_MEET_STAFF_CREDENTIAL_KEYS: ${SEREN_MEET_STAFF_CREDENTIAL_KEYS:?SEREN_MEET_STAFF_CREDENTIAL_KEYS is required}
      SEREN_MEET_STAFF_CREDENTIAL_MAX_REVEALS: ${SEREN_MEET_STAFF_CREDENTIAL_MAX_REVEALS:-10}
      SEREN_MEET_STAFF_CREDENTIAL_REVEAL_WINDOW_MINUTES: ${SEREN_MEET_STAFF_CREDENTIAL_REVEAL_WINDOW_MINUTES:-1}
      SEREN_MEET_OWNER_WECHAT_APP_ID: ${SEREN_MEET_OWNER_WECHAT_APP_ID:-}
      SEREN_MEET_OWNER_WECHAT_APP_SECRET: ${SEREN_MEET_OWNER_WECHAT_APP_SECRET:-}
      SEREN_MEET_MEMBER_WECHAT_APP_ID: ${SEREN_MEET_MEMBER_WECHAT_APP_ID:-}
      SEREN_MEET_MEMBER_WECHAT_APP_SECRET: ${SEREN_MEET_MEMBER_WECHAT_APP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  admin-web:
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${SEREN_MEET_HTTP_PORT:-8088}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      admin-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  seren_meet_pg_data:
